<form (ngSubmit)="onSubmit(contactForm)" #contactForm="ngForm">

  <input
    type="text"
    name="userName"
    ngModel
    placeholder="Your Name"
    required
  />

  <input
    type="email"
    name="email"
    ngModel
    placeholder="Your Email"
    required
  />

  <altcha-widget
  (statechange)="onAltchaStateChange($event)"
    challenge="http://localhost:3333/auth/get-altcha-challenge">
  </altcha-widget>

  <button type="submit">
    Submit
  </button>

</form>
